<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <title>Olasz–Magyar Tanuló Lejátszó</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #111;
      color: #eee;
      padding: 20px;
    }
    button {
      margin: 4px;
      padding: 10px 14px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>🎧 Olasz–Magyar tanuló lejátszó (v1)</h1>

  <p>Ez az első működő webes alapverzió. A logika már a végleges irányba mutat.</p>

  <div>
    <button onclick="play()">▶️ Play</button>
    <button onclick="pause()">⏸️ Pause</button>
    <button onclick="stop()">⏹️ Stop</button>
    <button onclick="prev()">⏮️ Prev</button>
    <button onclick="next()">⏭️ Next</button>
    <button onclick="toggleLoop()">🔁 Loop</button>
  </div>

  <script>
    // --- AUDIO CONTEXT ---
    const ctx = new (window.AudioContext || window.webkitAudioContext)();

    // --- PLACEHOLDER DATA ---
    const phrases = [
      { it: 'olasz1.mp3', hu: 'magyar1.mp3' },
      { it: 'olasz2.mp3', hu: 'magyar2.mp3' }
    ];

    let index = 0;
    let looping = false;
    let playing = false;

    function play() {
      ctx.resume();
      playing = true;
      console.log('PLAY – kifejezés', index + 1);
    }

    function pause() {
      playing = false;
      console.log('PAUSE');
    }

    function stop() {
      playing = false;
      index = 0;
      console.log('STOP');
    }

    function next() {
      index = (index + 1) % phrases.length;
      console.log('NEXT →', index + 1);
    }

    function prev() {
      index = Math.max(0, index - 1);
      console.log('PREV →', index + 1);
    }

    function toggleLoop() {
      looping = !looping;
      console.log('LOOP:', looping);
    }
  

    // --- AUDIO HELPERS ---
    async function loadBuffer(url) {
      const res = await fetch(url);
      const arrayBuffer = await res.arrayBuffer();
      return await ctx.decodeAudioData(arrayBuffer);
    }

    let itBuffer = null;
    let huBuffer = null;

    async function playOnePhrase() {
      if (!itBuffer || !huBuffer) {
        itBuffer = await loadBuffer('olasz1.mp3');
        huBuffer = await loadBuffer('magyar1.mp3');
      }

      // Olasz bal oldalon
      const itSource = ctx.createBufferSource();
      const itPan = ctx.createStereoPanner();
      itPan.pan.value = -1;
      itSource.buffer = itBuffer;
      itSource.connect(itPan).connect(ctx.destination);
      itSource.start();

      // gondolkodási szünet = olasz hossza
      const itDuration = itBuffer.duration * 1000;

      setTimeout(() => {
        // Magyar jobb oldalon
        const huSource = ctx.createBufferSource();
        const huPan = ctx.createStereoPanner();
        huPan.pan.value = 1;
        huSource.buffer = huBuffer;
        huSource.connect(huPan).connect(ctx.destination);
        huSource.start();
      }, itDuration * 2);
    }

    // ideiglenesen a Play gomb ehhez kötve
    function play() {
      ctx.resume();
      playOnePhrase();
    }

</body>
</html>
